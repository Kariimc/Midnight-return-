<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Midnight Return — HUD</title>
<style>
:root {
  --g0:#f8e870; --g1:#e8cc44; --g2:#c8a020; --g3:#8b6010;
  --g4:#5a3c08; --g5:#2e1e04;
  --iron-a:#0e0b05; --iron-b:#181208; --iron-c:#241808;
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  font-family:'Palatino Linotype',Palatino,Georgia,serif;
}

/* ──────────── VIEWPORT ──────────── */
.vp{
  width:960px;height:540px;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 25% 68%,rgba(65,25,0,.42) 0%,transparent 42%),
    radial-gradient(ellipse at 80% 22%,rgba(24,0,50,.38) 0%,transparent 42%),
    linear-gradient(180deg,#0a0710 0%,#110f1a 55%,#080510 100%);
}
.vp::before{  /* stone tiles */
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.007) 0,rgba(255,255,255,.007) 1px,transparent 1px,transparent 80px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.007) 0,rgba(255,255,255,.007) 1px,transparent 1px,transparent 60px);
}
.vp::after{  /* torch glow */
  content:'';position:absolute;top:0;right:90px;width:200px;height:170px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,105,14,.17) 0%,transparent 70%);
  pointer-events:none;
}

/* flash overlays */
.ov{position:absolute;inset:0;pointer-events:none;z-index:90;opacity:0;}
.ov.dmg.go  {animation:fD .5s ease-out forwards;}
.ov.heal.go {animation:fH .6s ease-out forwards;}
.ov.lvl.go  {animation:fL 2s  ease-out forwards;}
@keyframes fD{0%{opacity:1;background:rgba(200,0,0,.42)}   100%{opacity:0;background:rgba(200,0,0,0)}}
@keyframes fH{0%{opacity:1;background:rgba(30,200,80,.3)}  100%{opacity:0;background:rgba(30,200,80,0)}}
@keyframes fL{0%{opacity:1;background:radial-gradient(ellipse at 50% 100%,rgba(255,200,40,.58) 0%,transparent 60%)}
              65%{opacity:.6}100%{opacity:0}}

.vig{position:absolute;inset:0;pointer-events:none;z-index:89;
     box-shadow:inset 0 0 100px rgba(0,0,0,.6);transition:box-shadow .4s;}
.vig.danger{animation:vP 1.1s ease-in-out infinite;}
@keyframes vP{0%,100%{box-shadow:inset 0 0 100px rgba(0,0,0,.6)}
              50%{box-shadow:inset 0 0 100px rgba(175,0,0,.52),inset 0 0 52px rgba(175,0,0,.22)}}

/* ──────────── LV / EXP  top-left ──────────── */
.lv-panel{position:absolute;top:12px;left:14px;display:flex;flex-direction:column;gap:5px;}
.lv-box{
  display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(135deg,#1e1404,#0d0a02);
  border:1px solid var(--g2);padding:4px 12px;
  box-shadow:0 0 12px rgba(200,150,30,.18),inset 0 1px 0 rgba(200,150,30,.1);
}
.lv-lbl{font-size:9px;letter-spacing:2px;color:var(--g4);}
.lv-num{font-size:19px;font-weight:700;color:#ffe890;text-shadow:0 0 8px rgba(255,220,120,.55);}
.exp-row{display:flex;align-items:center;gap:5px;}
.exp-lbl{font-size:9px;letter-spacing:1px;color:var(--g4);}
.exp-trk{width:106px;height:5px;background:#070402;border:1px solid #3a2400;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);}
.exp-f{height:100%;background:linear-gradient(90deg,var(--g2),var(--g1));box-shadow:0 0 5px rgba(200,150,30,.7);transition:width .5s;}

/* ──────────── BOSS BAR  top-center ──────────── */
.boss-p{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:380px;opacity:0;transition:opacity .6s;pointer-events:none;}
.boss-p.on{opacity:1;pointer-events:all;}
.boss-nm{text-align:center;font-size:13px;letter-spacing:3px;color:#cc2244;text-transform:uppercase;margin-bottom:5px;text-shadow:0 0 14px rgba(200,30,60,.9),0 0 4px #000;}
.boss-trk{height:12px;background:#080009;border:2px solid #661133;box-shadow:0 0 14px rgba(180,20,50,.32),inset 0 2px 5px rgba(0,0,0,.9);overflow:hidden;}
.boss-f{height:100%;background:linear-gradient(90deg,#550011,#cc2244 65%,#ff4466 88%,#ff88aa 100%);box-shadow:0 0 10px rgba(200,30,60,.6),inset 0 1px 0 rgba(255,100,140,.3);transition:width .5s;}

/* ──────────── NOTIFICATIONS ──────────── */
.narea{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:95;}
.notif{background:rgba(8,5,1,.93);border:1px solid var(--g2);padding:8px 28px;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#ffe890;text-shadow:0 0 8px rgba(255,220,120,.6);box-shadow:0 0 22px rgba(200,150,30,.28);animation:nU 2.6s ease-out forwards;}
.notif.lu{border-color:var(--g0);font-size:20px;text-shadow:0 0 14px rgba(255,210,50,.9);box-shadow:0 0 36px rgba(255,200,40,.38);}
@keyframes nU{0%{opacity:0;transform:translateY(12px)}14%{opacity:1;transform:translateY(0)}70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-22px)}}

/* ──────────── STATS PANEL  top-left ──────────── */
.stats-tl{
  position:absolute;top:12px;left:14px;
  display:flex;flex-direction:column;gap:5px;
  background:linear-gradient(135deg,rgba(14,11,5,.97),rgba(8,5,0,.97));
  border:1px solid var(--g3);
  padding:8px 12px;
  width:210px;
  box-shadow:0 0 16px rgba(0,0,0,.85),0 0 5px rgba(200,150,30,.08),inset 0 1px 0 rgba(200,150,30,.08);
}
.st-row{display:flex;align-items:center;gap:7px;}
.st-ico{font-size:13px;width:15px;text-align:center;flex-shrink:0;}
.st-ico.hp{color:#ff3333;text-shadow:0 0 6px rgba(255,40,40,.9);}
.st-ico.mp{color:#3366ff;text-shadow:0 0 6px rgba(50,100,255,.9);}
.st-trk{flex:1;height:11px;background:#060302;border:1px solid #3a2000;position:relative;overflow:hidden;
        box-shadow:inset 0 1px 4px rgba(0,0,0,.9);}
.st-fill{position:absolute;inset:0;right:auto;transition:width .38s cubic-bezier(.4,0,.2,1);}
.st-fill.hp{background:linear-gradient(180deg,#ff8888 0%,#dd1e1e 28%,#aa0e0e 100%);box-shadow:0 0 8px rgba(255,20,20,.35),inset 0 1px 0 rgba(255,140,140,.28);}
.st-fill.mp{background:linear-gradient(180deg,#88aaff 0%,#2255ee 28%,#1840cc 100%);box-shadow:0 0 8px rgba(40,100,255,.35),inset 0 1px 0 rgba(140,190,255,.28);}
.st-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,transparent 100%);}
.st-val{font-size:10px;font-family:monospace;color:var(--g2);min-width:28px;text-align:right;letter-spacing:.5px;flex-shrink:0;}
.st-sep{height:1px;background:linear-gradient(90deg,transparent,rgba(200,150,30,.35) 30%,rgba(200,150,30,.35) 70%,transparent);}
.st-lv-row{display:flex;align-items:center;gap:6px;}
.st-lv-lbl{font-size:9px;letter-spacing:1.5px;color:var(--g4);flex-shrink:0;}
.st-lv-num{font-size:13px;font-weight:700;color:#ffe890;text-shadow:0 0 6px rgba(255,220,120,.5);flex-shrink:0;min-width:20px;}
.st-exp-trk{flex:1;height:4px;background:#070402;border:1px solid #3a2400;}
.st-exp-f{height:100%;background:linear-gradient(90deg,var(--g2),var(--g1));box-shadow:0 0 4px rgba(200,150,30,.6);transition:width .5s;}

/* ──────────── PORTRAIT ORB  bottom-left ──────────── */
.port-wrap{position:absolute;bottom:18px;left:16px;display:flex;flex-direction:column;align-items:center;gap:7px;}
.port{width:80px;height:80px;position:relative;display:flex;align-items:center;justify-content:center;}
.p-ring{
  position:absolute;inset:0;border-radius:50%;
  border:4px solid;border-color:var(--g0) var(--g4) var(--g0) var(--g1);
  box-shadow:0 0 0 2px #2a1800,0 0 20px rgba(200,150,30,.38),0 0 40px rgba(200,150,30,.12),inset 0 0 16px rgba(0,0,0,.9);
}
.p-face{
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#2a1800,#110a00 58%,#090500 100%);
  border:2px solid #5a3800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 14px rgba(0,0,0,.9);
}
.p-face span{font-size:28px;color:var(--g2);text-shadow:0 0 10px rgba(200,150,30,.9),0 0 22px rgba(200,100,20,.5);}
.pip{position:absolute;width:9px;height:9px;background:var(--g2);transform:rotate(45deg);box-shadow:0 0 5px rgba(200,150,30,.8);}
.pip.n{top:-2px;    left:50%;margin-left:-4.5px;}
.pip.s{bottom:-2px; left:50%;margin-left:-4.5px;}
.pip.e{right:-2px;  top:50%; margin-top:-4.5px;}
.pip.w{left:-2px;   top:50%; margin-top:-4.5px;}
.lives{display:flex;align-items:center;gap:5px;background:rgba(8,4,1,.88);border:1px solid #5a3800;padding:3px 11px;box-shadow:0 0 8px rgba(0,0,0,.6);}
.lh{color:#ff2233;font-size:14px;text-shadow:0 0 7px rgba(255,30,40,.9);}
.ln{font-size:14px;font-weight:700;color:#ffe890;letter-spacing:1px;text-shadow:0 0 5px rgba(255,220,120,.55);}

/* ──────────── ITEM SLOTS  bottom-right ──────────── */
.slots{position:absolute;bottom:18px;right:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.srow{display:flex;gap:4px;}
.slot{width:52px;height:52px;background:linear-gradient(135deg,#1c1204,#0e0902);border:2px solid #5a3800;
  box-shadow:0 0 0 1px #2a1800,inset 0 0 12px rgba(0,0,0,.85),0 2px 9px rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:border-color .18s,box-shadow .18s;}
.slot::before{content:'';position:absolute;inset:3px;border:1px solid rgba(200,150,30,.1);}
.slot:hover,.slot.on{border-color:var(--g2);box-shadow:0 0 0 1px #5a3800,0 0 14px rgba(200,150,30,.32),inset 0 0 12px rgba(0,0,0,.85);}
.slot .ico{font-size:25px;line-height:1;}
.slot .cnt{position:absolute;bottom:2px;right:4px;font-size:10px;font-weight:700;color:#e8d090;text-shadow:0 0 3px #000,0 1px 2px #000;}

/* ══════════════════════════════════════════════════
   CROSS HUD — bottom-center
   Ref: image 3 — iron cross, gold bevel, fleur caps
   Numbers float ABOVE (HP) and BELOW (MP) the cross
══════════════════════════════════════════════════ */
.cross-root{
  position:absolute;
  bottom:0; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center;
}

/* ── stat float above cross ── */
.stat-above{
  display:flex; align-items:baseline; gap:6px;
  margin-bottom:4px;
}
.stat-above .val{
  font-size:36px; font-weight:700;
  color:#fff; letter-spacing:1px;
  text-shadow:0 0 10px rgba(255,255,255,.5), 0 2px 4px rgba(0,0,0,1);
}
.stat-above .max{
  font-size:14px; color:rgba(255,255,255,.35);
  text-shadow:0 1px 3px rgba(0,0,0,1);
}

/* ── stat float below cross ── */
.stat-below{
  display:flex; align-items:baseline; gap:5px;
  margin-top:5px;
}
.stat-below .hico{
  font-size:18px; color:#ff2233;
  text-shadow:0 0 8px rgba(255,30,40,.9);
}
.stat-below .val{
  font-size:24px; font-weight:700;
  color:#fff;
  text-shadow:0 0 8px rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,1);
}

/* ── cross vertical top arm ── */
.cx-v-top{
  width:48px; height:42px;
  background:linear-gradient(90deg,
    #1a0e00 0%,#3c2800 16%,#7a5410 34%,
    var(--g1) 46%,var(--g0) 50%,var(--g1) 54%,
    #7a5410 66%,#3c2800 84%,#1a0e00 100%
  );
  position:relative;
  display:flex; justify-content:center;
}
/* subtle inner shadow → 3-D rod */
.cx-v-top::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 33%,rgba(0,0,0,.45) 50%,transparent 67%);}

/* ── fleur-de-lis cap (top) ── */
.cap{
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:5;flex-shrink:0;
}
/* Cap for top/bottom: 52px tall, 52px wide */
.cap-top,.cap-bot{
  width:52px;
}
/* Cap shape: three stacked lobes + thin stem */
/* We layer 3 rotated rounded diamonds to form a fleur */
.fleur{
  position:relative;
  width:52px; height:52px;
  display:flex;align-items:center;justify-content:center;
}
/* centre diamond */
.fleur::before{
  content:'';position:absolute;
  width:26px;height:26px;
  background:linear-gradient(135deg,var(--g0),var(--g2));
  transform:rotate(45deg);
  box-shadow:0 0 8px rgba(200,150,30,.6);
}
/* upper lobe */
.fleur::after{
  content:'';position:absolute;
  width:16px;height:22px;top:2px;left:50%;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--g0),var(--g2));
  border-radius:50% 50% 0 0;
  box-shadow:0 0 6px rgba(200,150,30,.5);
}
/* side lobes via inner element */
.fleur .fl-s{
  position:absolute;
  width:22px;height:14px;top:50%;transform:translateY(-50%);
  background:linear-gradient(90deg,var(--g2),var(--g1));
  border-radius:50%;
}
.fleur .fl-s.l{left:0;}
.fleur .fl-s.r{right:0;}
/* stem below */
.fleur .fl-stem{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:6px;height:12px;
  background:linear-gradient(90deg,var(--g3),var(--g1) 50%,var(--g3));
}

/* rotated for left/right caps */
.fleur.rot90  { transform:rotate(90deg); }
.fleur.rot180 { transform:rotate(180deg); }
.fleur.rotn90 { transform:rotate(-90deg); }

/* ── horizontal assembly ── */
.cx-h{
  display:flex; align-items:stretch;
  position:relative;
}

/* left/right arm ends — gold rod (horizontal) */
.cx-end{
  width:48px; flex-shrink:0;
  background:linear-gradient(0deg,
    #1a0e00 0%,#3c2800 16%,#7a5410 34%,
    var(--g1) 46%,var(--g0) 50%,var(--g1) 54%,
    #7a5410 66%,#3c2800 84%,#1a0e00 100%
  );
  position:relative;
  display:flex; align-items:center; justify-content:center;
}
.cx-end::after{content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,transparent 33%,rgba(0,0,0,.45) 50%,transparent 67%);}

/* cap containers on left/right */
.cap-side{width:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:5;}

/* scale/balance hanging from left end */
.scale{
  position:absolute;
  left:-48px; bottom:-10px;
  display:flex; flex-direction:column; align-items:center;
  z-index:10;
}
.sc-post{width:3px;height:18px;background:linear-gradient(90deg,#5a3c08,var(--g2) 50%,#5a3c08);}
.sc-arm{width:40px;height:3px;background:linear-gradient(0deg,#5a3c08,var(--g2) 50%,#5a3c08);}
.sc-chain{
  width:2px;height:18px;
  background:repeating-linear-gradient(180deg,var(--g2) 0,var(--g2) 2px,transparent 2px,transparent 5px);
  margin-top:3px;
}
.sc-ball{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#585870,#202030 58%,#101018);
  border:2px solid;
  border-color:#9898b8 #484860 #9898b8 #b0b0d0;
  box-shadow:0 3px 12px rgba(0,0,0,.9),inset 0 1px 0 rgba(220,220,255,.1);
}

/* ── MAIN BAR BODY ── */
.cx-body{
  width:400px; /* bars container */
  /* dark iron gradient — light top/bot edges give bevel of the cross arm face */
  background:linear-gradient(180deg,
    var(--iron-a)  0%,
    var(--iron-c) 5%,
    var(--iron-b) 10%,
    var(--iron-a) 90%,
    var(--iron-c) 95%,
    var(--iron-a) 100%
  );
  /* gold top/bottom borders — match the arm bevel color */
  border-top:4px solid transparent;
  border-bottom:4px solid transparent;
  border-image:linear-gradient(90deg,
    var(--g5),var(--g4) 6%,var(--g3) 16%,var(--g2) 26%,
    var(--g1) 38%,var(--g0) 50%,
    var(--g1) 62%,var(--g2) 74%,var(--g3) 84%,var(--g4) 94%,var(--g5)
  ) 1;
  padding:12px 22px;
  display:flex; flex-direction:column; gap:8px;
  position:relative;
  box-shadow:
    inset 0 1px 0 rgba(200,150,30,.14),
    inset 0 -1px 0 rgba(200,150,30,.14),
    inset 14px 0 32px rgba(0,0,0,.6),
    inset -14px 0 32px rgba(0,0,0,.6);
}
/* rivet dots */
.cx-body::before,.cx-body::after{
  content:'◆';position:absolute;top:50%;transform:translateY(-50%);
  font-size:7px;color:var(--g4);
}
.cx-body::before{left:10px;}
.cx-body::after{ right:10px;}

/* ── bar tracks ── */
.bar-row{
  display:flex;align-items:center;gap:10px;
}
.bico{font-size:15px;width:20px;text-align:center;flex-shrink:0;line-height:1;}
.bico.hp{color:#ff3333;text-shadow:0 0 7px rgba(255,40,40,.9),0 0 16px rgba(255,0,0,.4);}
.bico.mp{color:#3366ff;text-shadow:0 0 7px rgba(50,100,255,.9),0 0 16px rgba(0,80,255,.4);}

.bar-trk{
  flex:1;height:22px;
  background:#060302;
  border:1px solid #3a2000;
  box-shadow:inset 0 2px 7px rgba(0,0,0,.9),inset 0 0 12px rgba(0,0,0,.7);
  position:relative;overflow:hidden;border-radius:1px;
}
.bar-fill{
  position:absolute;inset:0;right:auto;
  border-radius:1px;
  transition:width .38s cubic-bezier(.4,0,.2,1);
}
.bar-fill.hp{
  background:linear-gradient(180deg,#ff8888 0%,#dd1e1e 18%,#aa0e0e 55%,#7a0505 100%);
  box-shadow:0 0 12px rgba(255,20,20,.4),inset 0 1px 0 rgba(255,140,140,.32);
}
.bar-fill.mp{
  background:linear-gradient(180deg,#88aaff 0%,#2255ee 18%,#1840cc 55%,#0d1e99 100%);
  box-shadow:0 0 12px rgba(40,100,255,.4),inset 0 1px 0 rgba(140,190,255,.32);
}
.bar-fill::after{  /* shine */
  content:'';position:absolute;top:0;left:0;right:0;height:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,transparent 100%);
}

/* gold separator between bars */
.bar-sep{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,150,30,.5) 20%,rgba(200,150,30,.5) 80%,transparent);
}

/* ── cross vertical bottom arm ── */
.cx-v-bot{
  width:48px;height:32px;
  background:linear-gradient(90deg,
    #1a0e00 0%,#3c2800 16%,#7a5410 34%,
    var(--g1) 46%,var(--g0) 50%,var(--g1) 54%,
    #7a5410 66%,#3c2800 84%,#1a0e00 100%
  );
  position:relative;
  display:flex; justify-content:center; align-items:flex-end;
}
.cx-v-bot::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 33%,rgba(0,0,0,.45) 50%,transparent 67%);}

/* ──────────── CONTROLS ──────────── */
.ctrl{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:960px;
}
.btn{
  padding:7px 16px;
  background:linear-gradient(180deg,#221502,#140e01);
  border:1px solid #5a3800;color:var(--g2);
  font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .14s;
}
.btn:hover{border-color:var(--g2);background:linear-gradient(180deg,#321e04,#1e1202);box-shadow:0 0 8px rgba(200,150,30,.22);}
.btn:active{transform:translateY(1px);}
.btn.r{border-color:#661111;color:#cc4444;}
.btn.b{border-color:#112266;color:#4466cc;}
.btn.g{border-color:#116611;color:#44cc44;}
.btn.p{border-color:#881133;color:#cc3355;}
</style>
</head>
<body>

<!-- ═══════════ VIEWPORT ═══════════ -->
<div class="vp">

  <!-- overlays -->
  <div class="ov dmg"  id="ovD"></div>
  <div class="ov heal" id="ovH"></div>
  <div class="ov lvl"  id="ovL"></div>
  <div class="vig"     id="vig"></div>

  <!-- notifications -->
  <div class="narea" id="narea"></div>

  <!-- HP / MP / LV — compact top-left panel -->
  <div class="stats-tl">
    <div class="st-row">
      <span class="st-ico hp">♥</span>
      <div class="st-trk"><div class="st-fill hp" id="hpF" style="width:78%"></div></div>
      <span class="st-val" id="hpC">780</span>
    </div>
    <div class="st-sep"></div>
    <div class="st-row">
      <span class="st-ico mp">✦</span>
      <div class="st-trk"><div class="st-fill mp" id="mpF" style="width:55%"></div></div>
      <span class="st-val" id="mpC">220</span>
    </div>
    <div class="st-sep"></div>
    <div class="st-lv-row">
      <span class="st-lv-lbl">LV</span>
      <span class="st-lv-num" id="lvN">12</span>
      <div class="st-exp-trk"><div class="st-exp-f" id="expF" style="width:42%"></div></div>
    </div>
  </div>

  <!-- BOSS BAR -->
  <div class="boss-p" id="bossP">
    <div class="boss-nm" id="bossNm">Death — The Reaper</div>
    <div class="boss-trk"><div class="boss-f" id="bossF" style="width:75%"></div></div>
  </div>

  <!-- PORTRAIT -->
  <div class="port-wrap">
    <div class="port">
      <div class="p-ring"></div>
      <div class="p-face"><span>⚔</span></div>
      <div class="pip n"></div><div class="pip s"></div>
      <div class="pip e"></div><div class="pip w"></div>
    </div>
    <div class="lives">
      <span class="lh">♥</span>
      <span class="ln" id="hrtN">09</span>
    </div>
  </div>

  <!-- ITEM SLOTS -->
  <div class="slots">
    <div class="srow">
      <div class="slot on" title="Short Sword"><span class="ico">⚔</span></div>
      <div class="slot"    title="Holy Flame" ><span class="ico">🔥</span><span class="cnt">8</span></div>
      <div class="slot"    title="Elixir"     ><span class="ico">⚗</span><span class="cnt">5</span></div>
    </div>
  </div>


</div><!-- /vp -->

<!-- ═══════════ CONTROLS ═══════════ -->
<div class="ctrl">
  <button class="btn r" onclick="G.dmg(120)">− HP</button>
  <button class="btn r" onclick="G.dmg(380)">Big Hit</button>
  <button class="btn g" onclick="G.heal(200)">+ HP</button>
  <button class="btn b" onclick="G.useMp(80)">− MP</button>
  <button class="btn b" onclick="G.restMp(120)">+ MP</button>
  <button class="btn"   onclick="G.lvlUp()">Level Up</button>
  <button class="btn p" onclick="G.boss()">Boss Fight</button>
  <button class="btn"   onclick="G.full()">Full Restore</button>
</div>

<script>
const G = (() => {
  const s = { hp:780, mxHp:1000, mp:220, mxMp:400,
               lv:12, exp:42, hearts:9,
               bossHp:75, bossOn:false, bossT:null };

  const el = id => document.getElementById(id);

  /* inject HP danger keyframe */
  const sty = document.createElement('style');
  sty.textContent = `@keyframes hpDanger{
    0%,100%{box-shadow:0 0 12px rgba(255,20,20,.4),inset 0 1px 0 rgba(255,140,140,.32)}
    50%    {box-shadow:0 0 30px rgba(255,0,0,.95),0 0 55px rgba(255,0,0,.22),inset 0 1px 0 rgba(255,140,140,.32)}}`;
  document.head.appendChild(sty);

  function upd() {
    const hp   = Math.max(0, s.hp),
          mp   = Math.max(0, s.mp),
          hpPct = hp / s.mxHp * 100,
          mpPct = mp / s.mxMp * 100;

    el('hpF').style.width = hpPct + '%';
    el('mpF').style.width = mpPct + '%';
    el('hpC').textContent = hp;
    el('mpC').textContent = mp;
    el('lvN').textContent = s.lv;
    el('expF').style.width = s.exp + '%';
    el('hrtN').textContent = String(s.hearts).padStart(2,'0');

    const d = hpPct < 25;
    el('hpF').style.animation = d ? 'hpDanger .75s ease-in-out infinite' : '';
    el('vig').classList.toggle('danger', d);
  }

  function flash(id) {
    const e = el(id);
    e.classList.remove('go');
    void e.offsetWidth;
    e.classList.add('go');
    e.addEventListener('animationend', () => e.classList.remove('go'), {once:true});
  }

  function notify(txt, cls='') {
    const d = document.createElement('div');
    d.className = 'notif ' + cls;
    d.textContent = txt;
    el('narea').appendChild(d);
    d.addEventListener('animationend', () => d.remove());
  }

  return {
    dmg(n)    { s.hp = Math.max(0, s.hp - n); flash('ovD'); upd(); },
    heal(n)   { s.hp = Math.min(s.mxHp, s.hp + n); flash('ovH'); upd(); },
    useMp(n)  { s.mp = Math.max(0, s.mp - n); upd(); },
    restMp(n) { s.mp = Math.min(s.mxMp, s.mp + n); upd(); },
    lvlUp() {
      s.lv++; s.exp = 0;
      s.mxHp += 65; s.hp = s.mxHp;
      s.mxMp += 28; s.mp = s.mxMp;
      flash('ovL'); notify('Level Up!', 'lu'); upd();
    },
    boss() {
      s.bossOn = !s.bossOn;
      el('bossP').classList.toggle('on', s.bossOn);
      if (s.bossT) clearInterval(s.bossT);
      if (s.bossOn) {
        s.bossHp = 75; el('bossF').style.width = '75%';
        s.bossT = setInterval(() => {
          s.bossHp = Math.max(0, s.bossHp - 1.2);
          el('bossF').style.width = s.bossHp + '%';
          if (s.bossHp <= 0) {
            clearInterval(s.bossT);
            notify('Boss Defeated');
            setTimeout(() => { el('bossP').classList.remove('on'); s.bossOn = false; }, 1200);
          }
        }, 100);
      }
    },
    full() { s.hp = s.mxHp; s.mp = s.mxMp; upd(); },
  };
})();

G.full();
</script>
</body>
</html>
