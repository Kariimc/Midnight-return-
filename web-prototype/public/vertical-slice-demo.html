<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Midnight Return — Vertical Slice</title>
<style>
:root{
  --g0:#f8e870;--g1:#e8cc44;--g2:#c8a020;--g3:#8b6010;--g4:#5a3c08;--g5:#2e1e04;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#05030a;color:#cbb27a;
  font-family:'Palatino Linotype',Palatino,Georgia,serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;
}
h1{font-size:15px;letter-spacing:4px;color:var(--g2);text-transform:uppercase;font-weight:400;}
.stage{position:relative;width:880px;height:320px;border:1px solid var(--g4);box-shadow:0 0 40px rgba(0,0,0,.8),0 0 8px rgba(200,150,30,.1);}
canvas{display:block;background:#08060f;}

/* vignette + danger pulse */
.vig{position:absolute;inset:0;pointer-events:none;z-index:5;box-shadow:inset 0 0 90px rgba(0,0,0,.7);}
.vig.danger{animation:vP 1s ease-in-out infinite;}
@keyframes vP{0%,100%{box-shadow:inset 0 0 90px rgba(0,0,0,.7)}50%{box-shadow:inset 0 0 90px rgba(150,0,0,.5)}}

/* ── stats panel (mirrors hud-final top-left) ── */
.stats-tl{
  position:absolute;top:10px;left:12px;z-index:10;
  display:flex;flex-direction:column;gap:5px;
  background:linear-gradient(135deg,rgba(14,11,5,.97),rgba(8,5,0,.97));
  border:1px solid var(--g3);padding:8px 11px;width:200px;
  box-shadow:0 0 16px rgba(0,0,0,.85),inset 0 1px 0 rgba(200,150,30,.08);
}
.st-row{display:flex;align-items:center;gap:7px;}
.st-ico{font-size:12px;width:14px;text-align:center;flex-shrink:0;}
.st-ico.hp{color:#ff3333;text-shadow:0 0 6px rgba(255,40,40,.9);}
.st-ico.mp{color:#3366ff;text-shadow:0 0 6px rgba(50,100,255,.9);}
.st-trk{flex:1;height:10px;background:#060302;border:1px solid #3a2000;position:relative;overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.9);}
.st-fill{position:absolute;inset:0;right:auto;transition:width .18s;}
.st-fill.hp{background:linear-gradient(180deg,#ff8888,#dd1e1e 28%,#aa0e0e);box-shadow:0 0 8px rgba(255,20,20,.35);}
.st-fill.mp{background:linear-gradient(180deg,#88aaff,#2255ee 28%,#1840cc);box-shadow:0 0 8px rgba(40,100,255,.35);}
.st-val{font-size:10px;font-family:monospace;color:var(--g2);min-width:30px;text-align:right;flex-shrink:0;}
.st-sep{height:1px;background:linear-gradient(90deg,transparent,rgba(200,150,30,.35) 30%,rgba(200,150,30,.35) 70%,transparent);}
.st-lv-row{display:flex;align-items:center;gap:6px;}
.st-lv-lbl{font-size:9px;letter-spacing:1.5px;color:var(--g4);}
.st-lv-num{font-size:13px;font-weight:700;color:#ffe890;min-width:18px;text-shadow:0 0 6px rgba(255,220,120,.5);}
.st-exp{flex:1;height:4px;background:#070402;border:1px solid #3a2400;}
.st-exp-f{height:100%;background:linear-gradient(90deg,var(--g2),var(--g1));transition:width .4s;}

/* room banner */
.banner{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);z-index:11;
  font-size:18px;letter-spacing:5px;color:#ffe890;text-transform:uppercase;text-align:center;
  text-shadow:0 0 18px rgba(255,210,80,.7),0 2px 6px #000;opacity:0;pointer-events:none;}
.banner.show{animation:bn 3.4s ease-out forwards;}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-40%)}16%{opacity:1;transform:translate(-50%,-50%)}74%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%)}}

/* toast (save / level) */
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:12;
  background:rgba(8,5,1,.93);border:1px solid var(--g2);padding:6px 22px;font-size:12px;
  letter-spacing:3px;text-transform:uppercase;color:#ffe890;opacity:0;pointer-events:none;}
.toast.show{animation:ts 2.2s ease-out forwards;}
@keyframes ts{0%{opacity:0;transform:translate(-50%,8px)}18%{opacity:1;transform:translate(-50%,0)}74%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}

.help{font-size:11px;letter-spacing:1px;color:var(--g4);max-width:880px;text-align:center;line-height:1.7;}
.help b{color:var(--g2);font-weight:400;}
.tag{display:inline-block;border:1px solid var(--g4);padding:1px 7px;margin:0 2px;color:var(--g2);font-family:monospace;font-size:10px;}
</style>
</head>
<body>

<h1>Vertical Slice · Entrance Hall</h1>

<div class="stage">
  <canvas id="cv" width="880" height="320"></canvas>
  <div class="vig" id="vig"></div>

  <div class="stats-tl">
    <div class="st-row"><span class="st-ico hp">♥</span><div class="st-trk"><div class="st-fill hp" id="hpF"></div></div><span class="st-val" id="hpV">120</span></div>
    <div class="st-sep"></div>
    <div class="st-row"><span class="st-ico mp">✦</span><div class="st-trk"><div class="st-fill mp" id="mpF"></div></div><span class="st-val" id="mpV">60</span></div>
    <div class="st-sep"></div>
    <div class="st-lv-row"><span class="st-lv-lbl">LV</span><span class="st-lv-num" id="lvV">1</span><div class="st-exp"><div class="st-exp-f" id="expF"></div></div></div>
  </div>

  <div class="banner" id="banner">Entrance Hall — Threshold</div>
  <div class="toast"  id="toast"></div>
  <div id="fade" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity 0.3s;"></div>
</div>

<div class="help">
  <span class="tag">← →</span> move &nbsp; <span class="tag">↑ ↓</span> climb ladder &nbsp;
  <span class="tag">Z / Space</span> jump &nbsp; <span class="tag">J</span> attack &nbsp;
  <span class="tag">K</span> sub-weapon (10 MP) &nbsp; <span class="tag">E</span> save (at statue) &nbsp;
  <span class="tag">R</span> reset
  <br><b>Goal:</b> clear the skeleton & zombie, leap the pit, climb to the save statue.
</div>

<script>
const cv=document.getElementById('cv'), x=cv.getContext('2d');
const S=20, COLS=44, ROWS=16, W=COLS*S, H=ROWS*S;

// ── Room layout (mirrors VerticalSliceContent.cs) ──────────────────────────
const FLOOR_ROW=14, PIT0=20,PIT1=23, LEDGE_ROW=10,LEDGE0=6,LEDGE1=12,
      PLAT_ROW=8,PLAT0=28,PLAT1=38, LADDER_COL=36;
const grid=[]; for(let r=0;r<ROWS;r++){grid.push(new Array(COLS).fill(0));}
function set(r,c,v){if(r>=0&&r<ROWS&&c>=0&&c<COLS)grid[r][c]=v;}
function rect(r0,c0,r1,c1,v){for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)set(r,c,v);}
// 1 = solid. Borders + ceiling
for(let c=0;c<COLS;c++)set(0,c,1);
for(let r=0;r<ROWS;r++){set(r,0,1);set(r,COLS-1,1);}
rect(FLOOR_ROW,1,ROWS-1,COLS-2,1);          // floor
rect(FLOOR_ROW,PIT0,ROWS-1,PIT1,0);         // pit gap
rect(LEDGE_ROW,LEDGE0,LEDGE_ROW,LEDGE1,1);  // low-left ledge
rect(PLAT_ROW,PLAT0,PLAT_ROW,PLAT1,1);      // high-right platform
const solid=(r,c)=> (r>=0&&r<ROWS&&c>=0&&c<COLS)?grid[r][c]===1:false;
const solidAt=(px,py)=>solid(Math.floor(py/S),Math.floor(px/S));

const ladderX0=LADDER_COL*S, ladderX1=(LADDER_COL+1)*S,
      ladderTop=PLAT_ROW*S, ladderBot=FLOOR_ROW*S;

// ── Entities ───────────────────────────────────────────────────────────────
const spawn={x:3*S+4,y:FLOOR_ROW*S-30};
const P={x:spawn.x,y:spawn.y,w:14,h:30,vx:0,vy:0,face:1,grounded:false,
         climbing:false,hp:120,mhp:120,mp:60,mmp:60,lv:1,exp:0,enext:100,
         iframes:0,atk:0,coyote:0,jumpHeld:false,jumpT:0};

function mkEnemy(o){return Object.assign({w:18,h:30,vx:0,face:-1,cd:0,hitFlash:0,dead:0,
  dissolve:0},o);}
let enemies=[];
function resetEnemies(){
  enemies=[
    mkEnemy({type:'Skeleton',x:15*S,y:FLOOR_ROW*S-30,hp:20,mhp:20,atk:12,def:0,exp:20,
             home:15*S,range:4*S,spd:1.3,det:9*S,col:'#d8d8b0',floorRow:FLOOR_ROW}),
    mkEnemy({type:'Zombie',x:9*S,y:LEDGE_ROW*S-30,hp:30,mhp:30,atk:8,def:2,exp:15,
             home:9*S,range:3*S,spd:0.85,det:7*S,col:'#4caf40',floorRow:LEDGE_ROW,
             lx0:LEDGE0*S,lx1:(LEDGE1+1)*S}),
  ];
}
resetEnemies();

const statue={x:33*S,y:PLAT_ROW*S-28,r:38,used:false,glow:0};

// ── Projectiles (sub-weapon) ─────────────────────────────────────────────────
let shots=[];

// ── Input ────────────────────────────────────────────────────────────────────
const K={};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  K[e.key.toLowerCase()]=true;
  if(e.key===' ')K['space']=true;
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false;if(e.key===' ')K['space']=false;});

let hitstop=0, shake=0;
const toast=(t)=>{const el=document.getElementById('toast');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');};

// ── Room state ────────────────────────────────────────────────────────────────
let currentRoom=1;
let doorUnlocked=false;
let transitioning=false;
let spawnCur={x:spawn.x,y:spawn.y};
let ladderX0Cur=ladderX0, ladderX1Cur=ladderX1;
let ladderTopCur=ladderTop, ladderBotCur=ladderBot;

// ── Physics helpers ──────────────────────────────────────────────────────────
function moveAxis(ent,dx,dy){
  // X
  ent.x+=dx;
  let r0=Math.floor(ent.y/S),r1=Math.floor((ent.y+ent.h-1)/S);
  if(dx>0){let c=Math.floor((ent.x+ent.w)/S);for(let r=r0;r<=r1;r++)if(solid(r,c)){ent.x=c*S-ent.w;break;}}
  else if(dx<0){let c=Math.floor(ent.x/S);for(let r=r0;r<=r1;r++)if(solid(r,c)){ent.x=(c+1)*S;break;}}
  // Y
  ent.y+=dy; ent.grounded=false;
  let c0=Math.floor(ent.x/S),c1=Math.floor((ent.x+ent.w-1)/S);
  if(dy>0){let r=Math.floor((ent.y+ent.h)/S);for(let c=c0;c<=c1;c++)if(solid(r,c)){ent.y=r*S-ent.h;ent.vy=0;ent.grounded=true;break;}}
  else if(dy<0){let r=Math.floor(ent.y/S);for(let c=c0;c<=c1;c++)if(solid(r,c)){ent.y=(r+1)*S;ent.vy=0;break;}}
}

function hurtPlayer(dmg){
  if(P.iframes>0)return;
  P.hp=Math.max(0,P.hp-dmg); P.iframes=60; shake=6;
  if(P.hp<=0){toast('You Died');setTimeout(reset,700);}
}

function gainExp(n){
  P.exp+=n;
  while(P.exp>=P.enext){
    P.exp-=P.enext; P.lv++; P.enext=Math.round(P.enext*1.45);
    P.mhp+=18; P.hp=P.mhp; P.mmp+=8; P.mp=P.mmp;
    toast('✦ Level Up — LV '+P.lv);
  }
}

function reset(){
  currentRoom=1;doorUnlocked=false;transitioning=false;
  // Rebuild room 1 grid
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c]=0;
  for(let c=0;c<COLS;c++)set(0,c,1);
  for(let r=0;r<ROWS;r++){set(r,0,1);set(r,COLS-1,1);}
  rect(FLOOR_ROW,1,ROWS-1,COLS-2,1);
  rect(FLOOR_ROW,PIT0,ROWS-1,PIT1,0);
  rect(LEDGE_ROW,LEDGE0,LEDGE_ROW,LEDGE1,1);
  rect(PLAT_ROW,PLAT0,PLAT_ROW,PLAT1,1);
  spawnCur={x:spawn.x,y:spawn.y};
  ladderX0Cur=ladderX0;ladderX1Cur=ladderX1;
  ladderTopCur=ladderTop;ladderBotCur=ladderBot;
  document.getElementById('fade').style.opacity='0';
  P.x=spawn.x;P.y=spawn.y;P.vx=0;P.vy=0;P.hp=P.mhp;P.mp=P.mmp;P.iframes=0;P.climbing=false;
  resetEnemies();statue.used=false;statue._used=false;shots=[];particles=[];dust=[];
}

// ── Room 2 (Catacombs) ───────────────────────────────────────────────────────
const R2={
  HIGH_ROW:5, HIGH_X0:2,  HIGH_X1:11,
  MID_ROW:8,  MID_X0:14,  MID_X1:23,
  LOW_ROW:11, LOW_X0:26,  LOW_X1:36,
  FLOOR_ROW:FLOOR_ROW,
  LEFT_FLOOR_X1:6, RIGHT_FLOOR_X0:32,
  STALA1:9, STALA2:24
};

function buildRoom2Grid(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c]=0;
  for(let c=0;c<COLS;c++)set(0,c,1);
  for(let r=0;r<ROWS;r++){set(r,0,1);set(r,COLS-1,1);}
  rect(FLOOR_ROW,1,ROWS-1,R2.LEFT_FLOOR_X1,1);
  rect(FLOOR_ROW,R2.RIGHT_FLOOR_X0,ROWS-1,COLS-2,1);
  for(let c=R2.HIGH_X0;c<=R2.HIGH_X1;c++)set(R2.HIGH_ROW,c,1);
  for(let c=R2.MID_X0;c<=R2.MID_X1;c++)set(R2.MID_ROW,c,1);
  for(let c=R2.LOW_X0;c<=R2.LOW_X1;c++)set(R2.LOW_ROW,c,1);
  for(let r=0;r<5;r++){set(r,R2.STALA1,1);set(r,R2.STALA1+1,1);}
  for(let r=0;r<4;r++){set(r,R2.STALA2,1);set(r,R2.STALA2+1,1);}
}

function resetRoom2Enemies(){
  enemies=[
    mkEnemy({type:'Shade',x:5*S,y:R2.HIGH_ROW*S-30,hp:35,mhp:35,atk:14,def:3,exp:30,
             home:5*S,range:3*S,spd:1.0,det:6*S,col:'#8888aa',floorRow:R2.HIGH_ROW,
             lx0:R2.HIGH_X0*S,lx1:(R2.HIGH_X1+1)*S}),
    mkEnemy({type:'Wraith',x:34*S,y:FLOOR_ROW*S-30,hp:25,mhp:25,atk:18,def:0,exp:35,
             home:34*S,range:4*S,spd:1.4,det:8*S,col:'#aa66cc',floorRow:R2.FLOOR_ROW,
             lx0:R2.RIGHT_FLOOR_X0*S,lx1:(COLS-2)*S}),
  ];
}

function checkRoomClear(){
  if(currentRoom!==1||doorUnlocked)return;
  if(enemies.every(e=>e.dead)){
    doorUnlocked=true;
    toast('✦ Exit Opened');
  }
}

function startTransition(){
  if(transitioning)return;
  transitioning=true;
  const fade=document.getElementById('fade');
  fade.style.opacity='1';
  setTimeout(()=>{
    currentRoom=2;
    buildRoom2Grid();
    resetRoom2Enemies();
    spawnCur={x:R2.HIGH_X0*S+4,y:R2.HIGH_ROW*S-30};
    ladderX0Cur=-999;ladderX1Cur=-998;
    ladderTopCur=-999;ladderBotCur=-998;
    P.x=spawnCur.x;P.y=spawnCur.y;P.vx=0;P.vy=0;P.climbing=false;
    shots=[];particles=[];
    const ban=document.getElementById('banner');
    ban.textContent='Catacombs — Shattered Hall';
    ban.classList.remove('show');
    void ban.offsetWidth;
    ban.classList.add('show');
    fade.style.opacity='0';
    setTimeout(()=>{transitioning=false;},320);
  },320);
}

// ── Particle system ──────────────────────────────────────────────────────────
let particles=[];

function addParticles(px,py,color,n=12){
  for(let i=0;i<n;i++){
    const angle=Math.random()*Math.PI*2;
    const spd=0.8+Math.random()*3.2;
    particles.push({
      x:px, y:py,
      vx:Math.cos(angle)*spd,
      vy:Math.sin(angle)*spd-1.5,
      life:55, maxLife:55,
      color:color,
      size:2+Math.random()*3
    });
  }
}

function updateParticles(){
  for(const p of particles){
    p.vy+=0.12;
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
  }
  particles=particles.filter(p=>p.life>0);
}

// ── Stone tile texture pre-generation ────────────────────────────────────────
function mkStone(seed){
  const oc=document.createElement('canvas');
  oc.width=20; oc.height=20;
  const oc2=oc.getContext('2d');
  // Base fill
  oc2.fillStyle=`hsl(255,${16+seed*2}%,${11+seed}%)`;
  oc2.fillRect(0,0,20,20);
  // Per-pixel noise via seeded LCG
  const id=oc2.getImageData(0,0,20,20);
  const d=id.data;
  let r=(seed*6364136223846793005+1442695040888963407)>>>0;
  for(let i=0;i<400;i++){
    r=(r*1664525+1013904223)>>>0;
    const v=((r>>>24)&0xff)/255;
    const vary=Math.floor(v*16)-8;
    const idx=i*4;
    d[idx]=Math.max(0,Math.min(255,d[idx]+vary));
    d[idx+1]=Math.max(0,Math.min(255,d[idx+1]+vary));
    d[idx+2]=Math.max(0,Math.min(255,d[idx+2]+vary));
  }
  oc2.putImageData(id,0,0);
  // 1px top highlight
  oc2.fillStyle='rgba(255,255,255,0.07)';
  oc2.fillRect(0,0,20,1);
  // 1px bottom shadow
  oc2.fillStyle='rgba(0,0,0,0.55)';
  oc2.fillRect(0,19,20,1);
  // 1px right shadow
  oc2.fillStyle='rgba(0,0,0,0.3)';
  oc2.fillRect(19,0,1,20);
  // Crack line if seed%3===0
  if(seed%3===0){
    oc2.strokeStyle='rgba(0,0,0,0.35)';
    oc2.lineWidth=0.4;
    oc2.beginPath();
    oc2.moveTo(3,2);
    oc2.lineTo(10,11);
    oc2.lineTo(17,18);
    oc2.stroke();
  }
  // 0.5px black border
  oc2.strokeStyle='rgba(0,0,0,1)';
  oc2.lineWidth=0.5;
  oc2.strokeRect(0,0,20,20);
  return oc;
}
const STONE_VARS=Array.from({length:8},(_,i)=>mkStone(i));
const tileVar=(r,c)=>((r*7+c*13)&7);

// ── Brick background pattern ──────────────────────────────────────────────────
function mkBrickPat(ctx){
  const oc=document.createElement('canvas');
  oc.width=40; oc.height=20;
  const oc2=oc.getContext('2d');
  // Base
  oc2.fillStyle='#0b0914';
  oc2.fillRect(0,0,40,20);
  // Row 1 bricks (y=1..8)
  oc2.fillStyle='#0f0c1a';
  oc2.fillRect(1,1,18,8);   // left brick
  oc2.fillRect(21,1,18,8);  // right brick
  // Top highlights row 1
  oc2.fillStyle='rgba(255,255,255,0.04)';
  oc2.fillRect(1,1,18,1);
  oc2.fillRect(21,1,18,1);
  // Row 2 (y=11..18) offset by 10px
  oc2.fillStyle='#0f0c1a';
  oc2.fillRect(1,11,8,8);   // left partial
  oc2.fillRect(11,11,18,8); // mid brick
  oc2.fillRect(31,11,8,8);  // right partial
  // Top highlights row 2
  oc2.fillStyle='rgba(255,255,255,0.04)';
  oc2.fillRect(1,11,8,1);
  oc2.fillRect(11,11,18,1);
  oc2.fillRect(31,11,8,1);
  return ctx.createPattern(oc,'repeat');
}
const brickPat=mkBrickPat(x);

// ── Torch state ───────────────────────────────────────────────────────────────
let torchT=0;
const TORCHES=[{x:18,y:6*S},{x:18,y:12*S}];

// ── Ambient dust ──────────────────────────────────────────────────────────────
let dust=[];
let dustT=0;

function spawnDust(){
  dustT++;
  if(dustT%120===0){
    dust.push({
      x:Math.random()*W,
      y:(ROWS-3)*S,
      vx:(Math.random()-.5)*0.3,
      vy:-0.15-Math.random()*0.25,
      life:180+Math.random()*80,
      maxLife:260,
      color:'#b8a0e0',
      size:1+Math.random()*1.5
    });
  }
  // Update dust
  for(const d of dust){
    d.x+=d.vx;
    d.y+=d.vy;
    d.life--;
  }
  dust=dust.filter(d=>d.life>0);
}

// ── Lighting canvas ───────────────────────────────────────────────────────────
const lCv=document.createElement('canvas');
lCv.width=W; lCv.height=H;
const lc=lCv.getContext('2d');

// ── Update ───────────────────────────────────────────────────────────────────
function update(){
  if(hitstop>0){hitstop--;return;}
  if(K['r']){reset();K['r']=false;}

  // ladder detection
  const onLadderX = (P.x+P.w/2)>ladderX0Cur && (P.x+P.w/2)<ladderX1Cur;
  const inLadderY = (P.y+P.h)>ladderTopCur-4 && P.y<ladderBotCur+S;
  const canClimb = onLadderX && inLadderY;
  if(canClimb && (K['arrowup']||K['arrowdown']) && !P.climbing){P.climbing=true;P.vy=0;}
  if(P.climbing && !canClimb)P.climbing=false;

  if(P.climbing){
    P.vy=0;
    let cy=0; if(K['arrowup'])cy=-2.0; else if(K['arrowdown'])cy=2.0;
    P.x += ((ladderX0Cur+ladderX1Cur)/2 - (P.x+P.w/2))*0.4; // snap to centre
    P.y += cy;
    if(P.y<ladderTopCur-P.h){P.climbing=false;P.y=ladderTopCur-P.h;}        // over the top
    if(K['z']||K['space']){P.climbing=false;P.vy=-6.4;}               // jump off
    if(P.grounded&&K['arrowdown'])P.climbing=false;
    moveAxis(P,0,0); // keep grounded flag fresh
  } else {
    // horizontal
    let ax=0; if(K['arrowleft'])ax=-1; if(K['arrowright'])ax=1;
    if(ax!==0)P.face=ax;
    P.vx += (ax*2.6 - P.vx)*(P.grounded?0.4:0.16);
    if(ax===0&&P.grounded)P.vx*=0.6;
    // jump (variable height + coyote)
    P.coyote = P.grounded?6:Math.max(0,P.coyote-1);
    const jp=K['z']||K['space'];
    if(jp&&!P.jumpHeld&&(P.grounded||P.coyote>0)){P.vy=-6.6;P.jumpHeld=true;P.jumpT=12;P.coyote=0;}
    if(!jp)P.jumpHeld=false;
    if(P.jumpHeld){P.jumpT--; if(!jp||P.jumpT<=0){if(P.vy<0)P.vy*=0.5;P.jumpHeld=false;}}
    P.vy=Math.min(P.vy+0.45,9); // gravity / terminal
    moveAxis(P,P.vx,0); moveAxis(P,0,P.vy);
  }

  // fell in pit
  if(P.y>H+40){hurtPlayer(10);P.x=spawnCur.x;P.y=spawnCur.y;P.vx=0;P.vy=0;}

  // attack
  if((K['j'])&&P.atk<=0){P.atk=14;}
  if(P.atk>0)P.atk--;
  const swinging = P.atk>6;
  if(swinging){
    const hb={x:P.face>0?P.x+P.w:P.x-30,y:P.y-2,w:30,h:P.h+4};
    for(const e of enemies){
      if(e.dead)continue;
      if(hb.x<e.x+e.w&&hb.x+hb.w>e.x&&hb.y<e.y+e.h&&hb.y+hb.h>e.y){
        if(e.hitFlash<=0){
          let dmg=Math.max(1,8+P.lv*3-e.def)+Math.floor(Math.random()*5);
          e.hp-=dmg; e.hitFlash=8; hitstop=2; shake=4;
          addParticles(e.x+e.w/2,e.y+e.h/2,'#ffeeaa',8);
          if(e.hp<=0&&!e.dead){e.dead=1;gainExp(e.exp);addParticles(e.x+e.w/2,e.y+e.h/2,e.col,28);checkRoomClear();}
        }
      }
    }
  }

  // sub-weapon
  if(K['k']&&P.mp>=10&&P._kcd!==true){P.mp-=10;P._kcd=true;
    shots.push({x:P.x+P.w/2,y:P.y+8,vx:P.face*5,life:90});}
  if(!K['k'])P._kcd=false;
  shots.forEach(s=>{s.x+=s.vx;s.life--;});
  for(const s of shots){for(const e of enemies){if(e.dead)continue;
    if(s.x>e.x&&s.x<e.x+e.w&&s.y>e.y&&s.y<e.y+e.h){e.hp-=14;e.hitFlash=8;s.life=0;
      addParticles(e.x+e.w/2,e.y+e.h/2,'#aaddff',8);
      if(e.hp<=0&&!e.dead){e.dead=1;gainExp(e.exp);addParticles(e.x+e.w/2,e.y+e.h/2,e.col,28);checkRoomClear();}}}}
  shots=shots.filter(s=>s.life>0&&s.x>0&&s.x<W);

  // enemies
  for(const e of enemies){
    if(e.dead){e.dissolve=Math.min(1,e.dissolve+0.04);continue;}
    if(e.hitFlash>0)e.hitFlash--;
    if(e.cd>0)e.cd--;
    const dx=(P.x+P.w/2)-(e.x+e.w/2), dist=Math.abs(dx);
    const samePlane=Math.abs((P.y+P.h)-(e.y+e.h))<S*1.5;
    if(dist<e.det && samePlane){            // chase
      e.face=dx>0?1:-1; e.x+=e.face*e.spd*1.4;
    } else {                                 // patrol
      e.x+=e.face*e.spd;
      if(Math.abs(e.x-e.home)>e.range)e.face*=-1;
      if(e.lx0!==undefined){ if(e.x<e.lx0){e.x=e.lx0;e.face=1;} if(e.x+e.w>e.lx1){e.x=e.lx1-e.w;e.face=-1;} }
    }
    // contact damage
    if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y&&e.cd<=0){
      hurtPlayer(e.atk); e.cd=70;
    }
  }
  enemies=enemies.filter(e=>!(e.dead&&e.dissolve>=1));

  // Exit door trigger (Room 1 only)
  if(currentRoom===1&&doorUnlocked&&!transitioning){
    const doorX=(COLS-1)*S-4;
    if(P.x+P.w>=doorX)startTransition();
  }

  // statue (Room 1 only)
  if(currentRoom===1){
    const sd=Math.hypot((P.x+P.w/2)-(statue.x+10),(P.y+P.h/2)-(statue.y+14));
    statue.near = sd<statue.r;
    statue.glow = 0.5+0.5*Math.sin(Date.now()/300);
    if(statue.near&&K['e']&&!statue._used){statue._used=true;statue.used=true;
      P.hp=P.mhp;P.mp=Math.min(P.mmp,P.mp+Math.floor(P.mmp/2));
      toast('✦ Game Saved — HP/MP Restored'); shake=2;}
    if(!K['e'])statue._used=false;
  } else {
    statue.near=false;
  }

  // timers / regen
  if(P.iframes>0)P.iframes--;
  if(P.mp<P.mmp)P.mp=Math.min(P.mmp,P.mp+0.04);
  if(shake>0)shake-=0.6;

  // particles and dust
  updateParticles();
  spawnDust();
}

// ── Draw ─────────────────────────────────────────────────────────────────────
function draw(){
  torchT++;
  const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake;
  x.setTransform(1,0,0,1,sx,sy);

  // ── LAYER 0: Far background ──────────────────────────────────────────────
  const bgGrad=x.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#060411'); bgGrad.addColorStop(1,'#0a0816');
  x.fillStyle=bgGrad; x.fillRect(0,0,W,H);

  // Brick fill (background pattern)
  x.fillStyle=brickPat;
  x.globalAlpha=0.7; x.fillRect(0,0,W,H); x.globalAlpha=1;

  // ── LAYER 1: Atmospheric parallax (faint Gothic columns) ────────────────
  x.save();
  x.globalAlpha=0.18;
  x.fillStyle='#1a1428';
  // Columns at 6 positions
  for(const cx of [1.5,8,18,26,36,42]){
    const colX=cx*S, cw=S*0.9;
    x.fillRect(colX,0,cw,H*0.7);
    // Column capital
    x.fillRect(colX-2,0,cw+4,S*0.6);
    // Arch hint
    x.beginPath();
    x.moveTo(colX,H*0.7);x.quadraticCurveTo(colX+cw/2,H*0.5,colX+cw,H*0.7);
    x.fill();
  }
  x.restore();

  // ── LAYER 2: Ladder (iron-look) ─────────────────────────────────────────
  // Rails
  x.save();
  x.shadowColor='rgba(180,130,60,0.4)'; x.shadowBlur=3;
  const railGrad=x.createLinearGradient(ladderX0,0,ladderX1,0);
  railGrad.addColorStop(0,'#7a5820');railGrad.addColorStop(0.5,'#c9993a');railGrad.addColorStop(1,'#5a3c10');
  x.strokeStyle=railGrad; x.lineWidth=3;
  x.beginPath();x.moveTo(ladderX0+5,ladderTop);x.lineTo(ladderX0+5,ladderBot);x.stroke();
  x.beginPath();x.moveTo(ladderX1-5,ladderTop);x.lineTo(ladderX1-5,ladderBot);x.stroke();
  x.shadowBlur=0;
  // Rungs
  for(let yy=ladderTop+8;yy<ladderBot;yy+=12){
    x.strokeStyle='#a07830'; x.lineWidth=2;
    x.beginPath();x.moveTo(ladderX0+5,yy);x.lineTo(ladderX1-5,yy);x.stroke();
    // Rivet dots
    x.fillStyle='#c9993a';
    x.beginPath();x.arc(ladderX0+5,yy,2,0,7);x.fill();
    x.beginPath();x.arc(ladderX1-5,yy,2,0,7);x.fill();
  }
  x.restore();

  // ── LAYER 3: Stone tiles (textured) ─────────────────────────────────────
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r][c]!==1)continue;
      const v=tileVar(r,c);
      x.drawImage(STONE_VARS[v], c*S, r*S, S, S);
      // Extra top-face bevel on floor/platform tops (tile above is empty)
      if(r>0 && grid[r-1][c]!==1){
        x.fillStyle='rgba(255,255,255,0.12)';
        x.fillRect(c*S, r*S, S, 2);
      }
    }
  }

  // Wall moss/grime streaks (atmospheric)
  x.save();
  x.globalAlpha=0.12;
  for(let c=1;c<COLS-1;c+=3){
    if(grid[0][c]===1&&grid[1][c]!==1){
      const gd=x.createLinearGradient(c*S+S/2,S,c*S+S/2,S*4);
      gd.addColorStop(0,'#1a3a1a');gd.addColorStop(1,'transparent');
      x.fillStyle=gd;
      x.fillRect(c*S+S*0.3,S,S*0.4,S*3);
    }
  }
  x.restore();

  // ── LAYER 4: Torch sconces ──────────────────────────────────────────────
  for(const t of TORCHES){
    // Bracket
    x.fillStyle='#5a3a0a'; x.fillRect(t.x-1,t.y-4,8,4);
    x.fillStyle='#8b5a18'; x.fillRect(t.x,t.y-6,6,3);
    // Flame (3 overlapping ellipses animated)
    const fl=Math.sin(torchT*0.18)*0.3+0.7;
    const fl2=Math.sin(torchT*0.26+1.2)*0.25+0.75;
    x.save();
    x.shadowColor='rgba(255,160,40,0.9)'; x.shadowBlur=16;
    [[0,'rgba(255,200,60,0.9)'],[fl*-1,'rgba(255,130,20,0.7)'],[fl2*1,'rgba(255,80,0,0.4)']].forEach(([ox,col],i)=>{
      x.fillStyle=col;
      x.beginPath();
      x.ellipse(t.x+3+ox*2,t.y-6-i*2,2-i*0.3,(4-i)*fl,0,0,Math.PI*2);
      x.fill();
    });
    x.restore();
  }

  // ── LAYER 5: Save statue ─────────────────────────────────────────────────
  x.save();
  const st=statue, sg=st.glow;
  // Outer glow
  const sGlow=x.createRadialGradient(st.x+10,st.y+14,4,st.x+10,st.y+14,st.r);
  const gc=st.used?`rgba(255,210,80,${0.22+0.1*sg})`:`rgba(60,130,255,${0.18+0.12*sg})`;
  sGlow.addColorStop(0,gc); sGlow.addColorStop(1,'transparent');
  x.fillStyle=sGlow; x.fillRect(st.x-40,st.y-40,100,100);
  // Base
  x.fillStyle='#1a1e40'; x.fillRect(st.x-2,st.y+20,24,10);
  // Body
  const sbg=x.createLinearGradient(st.x,st.y,st.x+20,st.y+28);
  sbg.addColorStop(0,st.used?'#4a3a00':'#1e2a6a');
  sbg.addColorStop(1,st.used?'#8a6a00':'#2a3da0');
  x.fillStyle=sbg; x.fillRect(st.x,st.y,20,28);
  // Gem
  x.shadowColor=st.used?'#ffe060':'#80b0ff'; x.shadowBlur=12+sg*8;
  x.fillStyle=st.used?'#ffe890':'#c0d8ff';
  x.beginPath();x.arc(st.x+10,st.y+8,4+sg*1.5,0,7);x.fill();
  x.shadowBlur=0;
  if(st.near&&!st.used){
    x.fillStyle='rgba(255,232,144,0.9)';x.font='bold 9px monospace';
    x.fillText('[E] SAVE',st.x-6,st.y-10);
  }
  x.restore();

  // ── LAYER 6: Projectiles ─────────────────────────────────────────────────
  for(const s of shots){
    x.save();
    x.shadowColor='#80c0ff'; x.shadowBlur=14;
    const sg2=x.createRadialGradient(s.x,s.y,0,s.x,s.y,7);
    sg2.addColorStop(0,'#ffffff');sg2.addColorStop(0.4,'#88ccff');sg2.addColorStop(1,'transparent');
    x.fillStyle=sg2; x.beginPath();x.arc(s.x,s.y,7,0,7);x.fill();
    x.shadowBlur=0; x.restore();
  }

  // ── LAYER 7: Enemies ─────────────────────────────────────────────────────
  for(const e of enemies){
    x.save();
    if(e.dead)x.globalAlpha=Math.max(0,1-e.dissolve*1.5);
    const flash=e.hitFlash>0;
    // Shadow
    x.fillStyle='rgba(0,0,0,0.35)'; x.fillRect(e.x+3,e.y+e.h,e.w-6,5);
    // Body
    const eg=x.createLinearGradient(e.x,e.y,e.x,e.y+e.h);
    if(flash){eg.addColorStop(0,'#ffffff');eg.addColorStop(1,'#dddddd');}
    else{eg.addColorStop(0,e.col);eg.addColorStop(1,e.col.replace('#','#')+'88');}
    x.fillStyle=flash?'#fff':eg; x.fillRect(e.x,e.y,e.w,e.h);
    // Outline
    x.strokeStyle=flash?'#fff':'rgba(0,0,0,0.6)';x.lineWidth=1;x.strokeRect(e.x+.5,e.y+.5,e.w-1,e.h-1);
    // Eye
    const eyeX=e.face>0?e.x+e.w-7:e.x+3;
    x.fillStyle=flash?'#f00':'#ff2200';
    x.shadowColor='#ff2200';x.shadowBlur=4;
    x.beginPath();x.arc(eyeX+1.5,e.y+7,2.5,0,7);x.fill();
    x.shadowBlur=0;
    // HP bar
    if(!e.dead){
      x.fillStyle='rgba(0,0,0,0.7)'; x.fillRect(e.x,e.y-7,e.w,4);
      x.fillStyle='#cc1111'; x.fillRect(e.x,e.y-7,e.w*(e.hp/e.mhp),4);
      x.strokeStyle='rgba(0,0,0,0.4)';x.lineWidth=0.5;x.strokeRect(e.x,e.y-7,e.w,4);
    }
    x.restore();
  }

  // ── LAYER 8: Player ─────────────────────────────────────────────────────
  x.save();
  if(P.iframes>0&&Math.floor(P.iframes/4)%2)x.globalAlpha=.35;
  // Shadow
  x.fillStyle='rgba(0,0,0,0.3)'; x.fillRect(P.x+2,P.y+P.h,P.w-4,5);
  // Cloak (body)
  const pg=x.createLinearGradient(P.x,P.y,P.x,P.y+P.h);
  pg.addColorStop(0,'#2a2040');pg.addColorStop(0.4,'#1c1630');pg.addColorStop(1,'#12101f');
  x.fillStyle=pg; x.fillRect(P.x,P.y,P.w,P.h);
  // Cloak edge highlight
  x.fillStyle='rgba(180,160,220,0.12)'; x.fillRect(P.face>0?P.x:P.x+P.w-2,P.y,2,P.h);
  // Collar/shoulder
  x.fillStyle='#6a1020'; x.fillRect(P.x-1,P.y,P.w+2,8);
  x.fillStyle='#8a1828'; x.fillRect(P.x,P.y,P.w,3);
  // Eye
  const eyePx=P.face>0?P.x+P.w-5:P.x+2;
  x.shadowColor='#ff1122'; x.shadowBlur=10;
  x.fillStyle='#ff3344'; x.fillRect(eyePx,P.y+3,3,3);
  x.shadowBlur=0;
  // Attack flash
  if(P.atk>6){
    x.globalAlpha=0.55;
    const ax=P.face>0?P.x+P.w:P.x-30;
    x.fillStyle='rgba(200,225,255,0.45)'; x.fillRect(ax,P.y-2,30,P.h+4);
    x.shadowColor='#ffffff';x.shadowBlur=8;
    x.strokeStyle='rgba(255,255,255,0.8)';x.lineWidth=1;x.strokeRect(ax,P.y-2,30,P.h+4);
    x.shadowBlur=0;
  }
  x.restore();

  // ── LAYER 9: Particles ────────────────────────────────────────────────────
  for(const p of particles){
    x.globalAlpha=Math.max(0,(p.life/p.maxLife)*0.9);
    x.fillStyle=p.color;
    x.fillRect(p.x-p.size*0.5,p.y-p.size*0.5,p.size,p.size);
  }
  x.globalAlpha=1;

  // Ambient dust
  for(const d of dust){
    x.globalAlpha=Math.max(0,d.life/d.maxLife)*0.25;
    x.fillStyle=d.color;
    x.beginPath();x.arc(d.x,d.y,d.size,0,7);x.fill();
  }
  x.globalAlpha=1;

  // ── LAYER 10: Dynamic lighting overlay ───────────────────────────────────
  lc.fillStyle='rgba(3,2,8,0.86)';
  lc.fillRect(0,0,W,H);
  lc.globalCompositeOperation='destination-out';
  // Torches
  for(const t of TORCHES){
    const fl=0.85+Math.sin(torchT*0.19)*0.15;
    const tr=55+Math.sin(torchT*0.31)*15;
    const tg=lc.createRadialGradient(t.x+3,t.y-4,0,t.x+3,t.y-4,tr*fl);
    tg.addColorStop(0,'rgba(255,165,40,0.62)');
    tg.addColorStop(0.35,'rgba(255,100,20,0.38)');
    tg.addColorStop(1,'transparent');
    lc.fillStyle=tg; lc.beginPath();lc.arc(t.x+3,t.y-4,tr*fl,0,7);lc.fill();
  }
  // Statue
  const sLr=65+Math.sin(Date.now()/290)*18;
  const slg=lc.createRadialGradient(statue.x+10,statue.y+10,0,statue.x+10,statue.y+10,sLr);
  slg.addColorStop(0,statue.used?'rgba(255,200,60,0.55)':'rgba(80,150,255,0.55)');
  slg.addColorStop(1,'transparent');
  lc.fillStyle=slg; lc.beginPath();lc.arc(statue.x+10,statue.y+10,sLr,0,7);lc.fill();
  // Player ambient
  const plr=28;
  const plg=lc.createRadialGradient(P.x+P.w/2,P.y+P.h/2,0,P.x+P.w/2,P.y+P.h/2,plr);
  plg.addColorStop(0,'rgba(200,180,255,0.22)');plg.addColorStop(1,'transparent');
  lc.fillStyle=plg; lc.beginPath();lc.arc(P.x+P.w/2,P.y+P.h/2,plr,0,7);lc.fill();
  lc.globalCompositeOperation='source-over';
  // Composite onto main canvas
  x.globalCompositeOperation='multiply';
  x.drawImage(lCv,0,0);
  x.globalCompositeOperation='source-over';

  // ── LAYER 11: Color grade overlay ─────────────────────────────────────────
  x.fillStyle='rgba(20,10,40,0.08)';
  x.fillRect(0,0,W,H);

  x.setTransform(1,0,0,1,0,0);
}

// ── HUD sync ─────────────────────────────────────────────────────────────────
function hud(){
  const hpP=Math.max(0,P.hp)/P.mhp*100, mpP=Math.max(0,P.mp)/P.mmp*100;
  document.getElementById('hpF').style.width=hpP+'%';
  document.getElementById('mpF').style.width=mpP+'%';
  document.getElementById('hpV').textContent=Math.ceil(P.hp);
  document.getElementById('mpV').textContent=Math.ceil(P.mp);
  document.getElementById('lvV').textContent=P.lv;
  document.getElementById('expF').style.width=(P.exp/P.enext*100)+'%';
  document.getElementById('vig').classList.toggle('danger',hpP<25);
}

function loop(){
  update();
  draw();
  hud();
  requestAnimationFrame(loop);
}
document.getElementById('banner').classList.add('show');
loop();
</script>
