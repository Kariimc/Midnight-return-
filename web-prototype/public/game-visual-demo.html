<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight Return — Game View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Cinzel',serif}
#c{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.loc{position:absolute;top:18px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:5px;color:rgba(180,148,52,.65);text-transform:uppercase}
.bars{position:absolute;bottom:28px;left:28px;display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-lbl{font-size:9px;letter-spacing:2px;width:20px;color:#7a6840}
.bar-track{width:160px;height:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.bar-fill{height:100%;transform-origin:left center}
#hp-fill{background:linear-gradient(90deg,#6b0000,#c41e1e)}
#mp-fill{background:linear-gradient(90deg,#000c50,#1830b8)}
.bar-val{font-size:8px;color:#5a4e36;min-width:56px}
#log{position:absolute;bottom:72px;left:28px;display:flex;flex-direction:column;gap:3px}
.msg{font-size:10px;letter-spacing:2px;opacity:0}
#hint{position:absolute;bottom:18px;right:28px;font-size:8px;letter-spacing:3px;color:rgba(100,84,50,.45)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="loc">Cursed Library · B2</div>
  <div class="bars">
    <div class="bar-row">
      <span class="bar-lbl">HP</span>
      <div class="bar-track"><div class="bar-fill" id="hp-fill" style="transform:scaleX(.72)"></div></div>
      <span class="bar-val" id="hpv">302 / 420</span>
    </div>
    <div class="bar-row">
      <span class="bar-lbl">MP</span>
      <div class="bar-track"><div class="bar-fill" id="mp-fill" style="transform:scaleX(.58)"></div></div>
      <span class="bar-val" id="mpv">70 / 120</span>
    </div>
  </div>
  <div id="log"></div>
  <div id="hint">CLICK TO ATTACK</div>
</div>
<div id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';

// ── GLSL ─────────────────────────────────────────────────────────────────────
const UV_VERT = `varying vec2 vUv;
void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;

const FLOOR_FRAG = `varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec2 uv=vUv*vec2(10.,5.);
  vec2 i=floor(uv),f=fract(uv);
  float c=h(i);
  float b=clamp(min(min(f.x,1.-f.x),min(f.y,1.-f.y))*8.,0.,1.);
  float ns=n(uv*3.7)*.07;
  vec3 stone=vec3(.11+c*.06,.09+c*.05,.13+c*.07)+ns;
  vec3 mort=vec3(.038,.032,.050);
  vec3 col=mix(mort,stone,smoothstep(0.,.35,b));
  col*=.4+.6*smoothstep(0.,.5,b);
  float wet=max(0.,.5-abs(vUv.x-.5))*(1.-vUv.y)*.14;
  col+=wet*vec3(.22,.12,.40);
  col=mix(col,vec3(.025,.018,.038),vUv.y*.55);
  gl_FragColor=vec4(col,1.);}`;

const WALL_FRAG = `varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){
  float row=floor(vUv.y*7.);
  float off=mod(row,2.)*.5;
  vec2 bUv=vec2(vUv.x*9.+off,vUv.y*7.);
  vec2 i=floor(bUv),f=fract(bUv);
  float c=h(i);
  float m=clamp(min(min(f.x,1.-f.x),min(f.y,1.-f.y))*9.,0.,1.);
  float ns=n(bUv*2.3)*.06;
  vec3 brick=vec3(.082+c*.05,.067+c*.04,.10+c*.06)+ns;
  vec3 mort=vec3(.030,.025,.040);
  vec3 col=mix(mort,brick,smoothstep(0.,.32,m));
  col*=.35+.65*smoothstep(0.,.45,m);
  vec2 cv=vUv*2.-1.;
  col*=1.-dot(cv,cv)*.42;
  col=mix(col*.15,col,smoothstep(0.,.28,vUv.y));
  gl_FragColor=vec4(col,1.);}`;

const EMBER_VERT = `
attribute float pA; attribute float pS; attribute float pP;
uniform float time; uniform vec3 origin; varying float vL;
void main(){
  float t=fract(pA+time*pS); vL=t;
  vec3 p=origin;
  p.y+=t*2.8+pow(t,2.)*.5;
  p.x+=sin(t*13.+pP)*.22*(1.-t);
  p.z+=cos(t*7.5+pP*1.5)*.12;
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_PointSize=max(.5,(1.-t)*5.*(280./-mv.z));
  gl_Position=projectionMatrix*mv;}`;

const EMBER_FRAG = `varying float vL;
void main(){
  if(length(gl_PointCoord-.5)>.5)discard;
  float a=(1.-vL*vL)*(1.-length(gl_PointCoord-.5)*2.)*.95;
  vec3 c=mix(vec3(1.,.92,.6),vec3(1.,.42,.05),vL);
  c=mix(c,vec3(.5,.02,0.),min(1.,vL*1.9));
  gl_FragColor=vec4(c,a);}`;

const DUST_VERT = `
attribute float pA; attribute float pS; attribute float pP;
uniform float time; varying float vL;
void main(){
  float t=fract(pA+time*pS); vL=t;
  vec3 p=position;
  p.x+=sin(time*.28+pP)*.9;
  p.y+=sin(time*.19+pP*2.1)*.45;
  p.z+=cos(time*.14+pP*1.7)*.35;
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_PointSize=1.8*(180./-mv.z);
  gl_Position=projectionMatrix*mv;}`;

const DUST_FRAG = `varying float vL;
void main(){
  if(length(gl_PointCoord-.5)>.5)discard;
  gl_FragColor=vec4(.7,.65,.82,.09*(1.-length(gl_PointCoord-.5)*2.));}`;

const CAPE_VERT = `
uniform float time;
varying vec3 vWp; varying vec3 vNorm;
void main(){
  vec3 p=position;
  float ny=clamp((.55-p.y)/1.1,0.,1.);
  p.z+=sin(time*2.3+ny*5.0)*.09*ny*ny;
  p.x+=cos(time*1.8+ny*3.2)*.055*ny;
  vec4 wp=modelMatrix*vec4(p,1.); vWp=wp.xyz;
  vNorm=normalMatrix*normal;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`;

const CAPE_FRAG = `
uniform float time; varying vec3 vWp; varying vec3 vNorm;
void main(){
  vec3 nL=normalize(vec3(-3.2,.9,-2.1)-vWp);
  vec3 nR=normalize(vec3( 3.2,.9,-2.1)-vWp);
  float dL=max(0.,dot(normalize(vNorm),nL));
  float dR=max(0.,dot(normalize(vNorm),nR));
  float atL=5./(1.+length(vec3(-3.2,.9,-2.1)-vWp)*length(vec3(-3.2,.9,-2.1)-vWp)*.18);
  float atR=5./(1.+length(vec3( 3.2,.9,-2.1)-vWp)*length(vec3( 3.2,.9,-2.1)-vWp)*.18);
  vec3 torch=vec3(1.,.42,.1);
  vec3 col=vec3(.065,.042,.10);
  col+=torch*(dL*atL+dR*atR)*col*3.5;
  gl_FragColor=vec4(col,.93);}`;

const POST_FRAG = `
uniform sampler2D tDiffuse; uniform float time; uniform float ca;
varying vec2 vUv;
void main(){
  vec2 c=vUv-.5; float d=length(c);
  float r=texture2D(tDiffuse,vUv+c*ca*d*1.3).r;
  float g=texture2D(tDiffuse,vUv).g;
  float b=texture2D(tDiffuse,vUv-c*ca*d*.9).b;
  vec3 col=vec3(r,g,b);
  float vig=pow(max(0.,1.-d*d*1.7),1.4); col*=vig;
  float grain=fract(sin(dot(vUv+fract(time*.07),vec2(12.9898,78.233)))*43758.5453);
  col+=(grain-.5)*.028;
  col*=.97+.03*sin(vUv.y*900.);
  gl_FragColor=vec4(col,1.);}`;

// ── RENDERER ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x03020A);
scene.fog = new THREE.FogExp2(0x05030E,.075);

const camera = new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,100);
camera.position.set(0,.25,9.5);
camera.lookAt(0,0,0);

// ── LIGHTS ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x0E0818,.5));
const moon = new THREE.DirectionalLight(0x14142A,.25);
moon.position.set(0,6,3); scene.add(moon);
const tL = new THREE.PointLight(0xFF6518,5.,10,2); tL.position.set(-3.2,.9,-1.8); scene.add(tL);
const tR = new THREE.PointLight(0xFF6518,5.,10,2); tR.position.set( 3.2,.9,-1.8); scene.add(tR);
const eyeL = new THREE.PointLight(0xFF0808,.9,2.2,2); eyeL.position.set(.18,.38,.1); scene.add(eyeL);

// ── GEOMETRY ─────────────────────────────────────────────────────────────────
// Floor
const floorM = new THREE.ShaderMaterial({uniforms:{},vertexShader:UV_VERT,fragmentShader:FLOOR_FRAG});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,8),floorM);
floor.rotation.x = -Math.PI/2; floor.position.set(0,-1.5,-.5); scene.add(floor);

// Back wall
const wallM = new THREE.ShaderMaterial({uniforms:{},vertexShader:UV_VERT,fragmentShader:WALL_FRAG});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(20,9),wallM);
wall.position.set(0,1.5,-4.2); scene.add(wall);

// Gothic arch canvas overlay
function makeArchTex(){
  const W=1024,H=512,cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  function arch(cx,baseY,w,h){
    const hw=w/2;
    ctx.fillStyle='rgba(10,7,18,.93)';
    ctx.fillRect(cx-hw,baseY-h,hw*.18,h);
    ctx.fillRect(cx+hw*.82,baseY-h,hw*.18,h);
    ctx.beginPath();
    ctx.moveTo(cx-hw*.82,baseY-h*.55);
    ctx.bezierCurveTo(cx-hw*.82,baseY-h+40,cx,baseY-h-6,cx,baseY-h-6);
    ctx.bezierCurveTo(cx,baseY-h-6,cx+hw*.82,baseY-h+40,cx+hw*.82,baseY-h*.55);
    ctx.lineTo(cx+hw,baseY-h*.55);ctx.lineTo(cx+hw,baseY);
    ctx.lineTo(cx-hw,baseY);ctx.lineTo(cx-hw,baseY-h*.55);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(16,10,26,.97)';
    ctx.beginPath();ctx.moveTo(cx-14,baseY-h+42);ctx.lineTo(cx,baseY-h-5);ctx.lineTo(cx+14,baseY-h+42);ctx.closePath();ctx.fill();
  }
  arch(W*.5,H,W*.52,H*.87);
  arch(W*.08,H,W*.26,H*.76);
  arch(W*.92,H,W*.26,H*.76);
  ctx.fillStyle='rgba(6,4,14,.72)';ctx.fillRect(0,H*.87,W,H*.13);
  return new THREE.CanvasTexture(cv);
}
const archMesh = new THREE.Mesh(new THREE.PlaneGeometry(18,9),
  new THREE.MeshBasicMaterial({map:makeArchTex(),transparent:true,alphaTest:.04,depthWrite:false}));
archMesh.position.set(0,1.5,-2.6); scene.add(archMesh);

// Torches
const torchMat = new THREE.MeshPhongMaterial({color:0x1a1010,specular:0x220800,shininess:15});
function makeTorch(x){
  const g=new THREE.Group();
  const bracket=new THREE.Mesh(new THREE.BoxGeometry(.12,.06,.22),torchMat);
  bracket.position.set(0,0,.11); g.add(bracket);
  const stick=new THREE.Mesh(new THREE.CylinderGeometry(.024,.03,.48,5),
    new THREE.MeshPhongMaterial({color:0x25150A}));
  stick.position.set(0,.14,0); g.add(stick);
  const flame=new THREE.Mesh(new THREE.SphereGeometry(.08,8,8),
    new THREE.MeshBasicMaterial({color:0xFF7030}));
  flame.position.set(0,.44,0); g.add(flame); g.userData.flame=flame;
  g.position.set(x,.9,-2.1); scene.add(g); return g;
}
const tLG=makeTorch(-3.2), tRG=makeTorch(3.2);

// ── PARTICLES ─────────────────────────────────────────────────────────────────
function makeEmbers(pos,count=80){
  const geo=new THREE.BufferGeometry();
  const P=new Float32Array(count*3),A=new Float32Array(count),S=new Float32Array(count),Ph=new Float32Array(count);
  for(let i=0;i<count;i++){
    P[i*3]=pos.x+(Math.random()-.5)*.15; P[i*3+1]=pos.y; P[i*3+2]=pos.z+(Math.random()-.5)*.1;
    A[i]=Math.random(); S[i]=.2+Math.random()*.35; Ph[i]=Math.random()*Math.PI*2;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(P,3));
  geo.setAttribute('pA',new THREE.BufferAttribute(A,1));
  geo.setAttribute('pS',new THREE.BufferAttribute(S,1));
  geo.setAttribute('pP',new THREE.BufferAttribute(Ph,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{time:{value:0},origin:{value:new THREE.Vector3(pos.x,pos.y+.44,pos.z)}},
    vertexShader:EMBER_VERT,fragmentShader:EMBER_FRAG,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(geo,mat); scene.add(pts); return pts;
}
const eL=makeEmbers(new THREE.Vector3(-3.2,.46,-2.1));
const eR=makeEmbers(new THREE.Vector3( 3.2,.46,-2.1));

// Ambient dust
{
  const n=130,geo=new THREE.BufferGeometry();
  const P=new Float32Array(n*3),A=new Float32Array(n),S=new Float32Array(n),Ph=new Float32Array(n);
  for(let i=0;i<n;i++){
    P[i*3]=(Math.random()-.5)*13; P[i*3+1]=(Math.random()-.5)*4; P[i*3+2]=(Math.random()-.5)*4-1;
    A[i]=Math.random(); S[i]=.04+Math.random()*.07; Ph[i]=Math.random()*Math.PI*2;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(P,3));
  geo.setAttribute('pA',new THREE.BufferAttribute(A,1));
  geo.setAttribute('pS',new THREE.BufferAttribute(S,1));
  geo.setAttribute('pP',new THREE.BufferAttribute(Ph,1));
  const mat=new THREE.ShaderMaterial({
    uniforms:{time:{value:0}},
    vertexShader:DUST_VERT,fragmentShader:DUST_FRAG,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  scene.add(new THREE.Points(geo,mat));
  scene.userData.dustMat=mat;
}

// ── CHARACTER ─────────────────────────────────────────────────────────────────
const cg=new THREE.Group();
const cMat=new THREE.MeshPhongMaterial({color:0x0D0A15,specular:0x181020,shininess:8});
const eMat=new THREE.MeshPhongMaterial({color:0x0C0918,specular:0x200A28,emissive:0x180A22,shininess:4});

// Cape with GPU cloth animation
const capeMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:CAPE_VERT,fragmentShader:CAPE_FRAG,
  side:THREE.DoubleSide,transparent:true});
const cape=new THREE.Mesh(new THREE.PlaneGeometry(.78,1.12,3,10),capeMat);
cape.position.set(.04,-.12,-.1); cg.add(cape);

// Body geometry helper
const box=(w,h,d,x,y,z,m=cMat)=>{
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  b.position.set(x,y,z); cg.add(b); return b;};
box(.16,.56,.14,-.1,-.72,0);        // leg L
box(.16,.56,.14, .1,-.72,0);        // leg R
box(.52,.58,.17, 0,-.16,0);         // torso
box(.16,.12,.22,-.30,.07,0,eMat);   // pauldron L
box(.16,.12,.22, .30,.07,0,eMat);   // pauldron R
box(.32,.38,.17, 0,.28,0);          // head
// Red eye — MeshBasicMaterial so it always emits regardless of lighting (bloom catches it)
const eye=new THREE.Mesh(new THREE.SphereGeometry(.04,7,7),
  new THREE.MeshBasicMaterial({color:0xFF1010}));
eye.position.set(.09,.30,.10); cg.add(eye);
// Sword
const sMat=new THREE.MeshPhongMaterial({color:0x1A2234,specular:0x5070A0,shininess:90});
box(.04,.76,.022,.44,-.28,0,sMat);  // blade
box(.17,.042,.055,.44,.04,0,sMat);  // guard

cg.position.set(0,.18,0); scene.add(cg);

// ── ATTACK SPARKS ─────────────────────────────────────────────────────────────
const SK=60;
const skGeo=new THREE.BufferGeometry();
const skBuf=new Float32Array(SK*3), skAgeBuf=new Float32Array(SK);
skGeo.setAttribute('position',new THREE.BufferAttribute(skBuf,3));
skGeo.setAttribute('pA',new THREE.BufferAttribute(skAgeBuf,1));
const skMat=new THREE.ShaderMaterial({
  uniforms:{},
  vertexShader:`attribute float pA;varying float vA;
void main(){vA=pA;vec4 mv=modelViewMatrix*vec4(position,1.);
gl_PointSize=max(0.,(1.-pA)*6.*(220./-mv.z));gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;
void main(){if(length(gl_PointCoord-.5)>.5)discard;
vec3 c=mix(vec3(1.,.88,.4),vec3(1.,.28,0.),vA);gl_FragColor=vec4(c,(1.-vA)*(1.-vA)*.9);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
const sparks=new THREE.Points(skGeo,skMat); sparks.visible=false; scene.add(sparks);
const skV=[]; for(let i=0;i<SK;i++) skV.push(new THREE.Vector3());
let skActive=false, skT=0;

function triggerSparks(hp){
  for(let i=0;i<SK;i++){
    skBuf[i*3]=hp.x+(Math.random()-.5)*.35;
    skBuf[i*3+1]=hp.y+(Math.random()-.5)*.35;
    skBuf[i*3+2]=hp.z;
    const a=Math.random()*Math.PI*2, sp=.018+Math.random()*.055;
    skV[i].set(Math.cos(a)*sp,(Math.sin(a)*sp*1.4+.018),(Math.random()-.5)*.012);
    skAgeBuf[i]=0;
  }
  skGeo.attributes.position.needsUpdate=true;
  skGeo.attributes.pA.needsUpdate=true;
  sparks.visible=true; skActive=true; skT=0;
}

// ── POST-PROCESSING ───────────────────────────────────────────────────────────
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.7,.58,.32);
composer.addPass(bloom);
const postPass=new ShaderPass({
  uniforms:{tDiffuse:{value:null},time:{value:0},ca:{value:.02}},
  vertexShader:UV_VERT,fragmentShader:POST_FRAG});
composer.addPass(postPass);

// ── LOOP ─────────────────────────────────────────────────────────────────────
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(), t=clock.getElapsedTime();

  // Torch flicker — two sine waves for organic randomness
  const fL=1.+Math.sin(t*7.4)*.2+Math.sin(t*13.9)*.09;
  const fR=1.+Math.sin(t*6.2+1.1)*.2+Math.sin(t*12.1)*.09;
  tL.intensity=5.*fL; tR.intensity=5.*fR;
  tLG.userData.flame.scale.setScalar(.75+fL*.32);
  tRG.userData.flame.scale.setScalar(.75+fR*.32);

  // Cape
  capeMat.uniforms.time.value=t;

  // Character idle bob
  cg.position.y=.18+Math.sin(t*1.45)*.027;
  cg.rotation.z=Math.sin(t*1.2)*.013;

  // Eye pulse
  eyeL.intensity=.7+Math.sin(t*2.3)*.32;
  eye.scale.setScalar(.82+Math.sin(t*3.0)*.22);

  // Particles
  eL.material.uniforms.time.value=t;
  eR.material.uniforms.time.value=t;
  if(scene.userData.dustMat) scene.userData.dustMat.uniforms.time.value=t;

  // Sparks update
  if(skActive){
    skT+=dt;
    for(let i=0;i<SK;i++){
      skBuf[i*3]  +=skV[i].x;
      skBuf[i*3+1]+=skV[i].y;
      skBuf[i*3+2]+=skV[i].z;
      skV[i].y-=.001;
      skAgeBuf[i]=Math.min(1.,skT*1.9);
    }
    skGeo.attributes.position.needsUpdate=true;
    skGeo.attributes.pA.needsUpdate=true;
    if(skT>.75){ sparks.visible=false; skActive=false; }
  }

  postPass.uniforms.time.value=t;
  composer.render();
}
animate();

// ── INTERACTION ───────────────────────────────────────────────────────────────
function log(msg,col='#d4a030'){
  const el=document.createElement('div');
  el.className='msg'; el.textContent=msg; el.style.color=col;
  document.getElementById('log').appendChild(el);
  gsap.to(el,{opacity:1,duration:.12});
  gsap.to(el,{opacity:0,y:-18,duration:.45,delay:1.1,onComplete:()=>el.remove()});
}

document.addEventListener('click',e=>{
  const mx=(e.clientX/innerWidth)*2-1;
  const my=-(e.clientY/innerHeight)*2+1;
  triggerSparks(new THREE.Vector3(mx*4.2,my*2.4+.3,0));

  gsap.fromTo('#flash',{opacity:.14},{opacity:0,duration:.22});

  // Camera shake via GSAP on Three.js Vector3
  gsap.to(camera.position,{
    x:(Math.random()-.5)*.09, y:.25+(Math.random()-.5)*.07,
    duration:.055,yoyo:true,repeat:4,
    onComplete:()=>{ camera.position.x=0; camera.position.y=.25; }});

  // Sword swing
  gsap.to(cg.rotation,{z:-.45,duration:.07,ease:'power4.out'});
  gsap.to(cg.rotation,{z:0,duration:.32,delay:.07,ease:'elastic.out(1,.6)'});

  // Bloom spike
  gsap.to(bloom,{strength:3.4,duration:.06});
  gsap.to(bloom,{strength:1.7,duration:.38,delay:.06});

  // Eye flash
  gsap.to(eyeL,{intensity:5.,duration:.04});
  gsap.to(eyeL,{intensity:.7,duration:.28,delay:.04});

  const crit=Math.random()<.2;
  const dmg=18+Math.floor(Math.random()*30);
  log(crit?`CRITICAL — ${dmg*2}`:`${dmg} DMG`,crit?'#ffd040':'#d4a030');
});

// ── RESIZE ────────────────────────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.resolution.set(innerWidth,innerHeight);
});
</script>
</body>
</html>
